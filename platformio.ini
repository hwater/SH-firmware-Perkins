; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;set default_envs to whichever board(s) you use. Build/Run/etc processes those envs
default_envs =
  esp32dev
; Pull upload credentials from a gitignored file (copy secrets.example.ini).
extra_configs =
  secrets.ini

[env]
framework = arduino
lib_ldf_mode = deep
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  SignalK/SensESP @ ^3.4.0
  SensESP/OneWire@^3.0.1
  adafruit/Adafruit SSD1306 @ ^2.5.1
  ttlappalainen/NMEA2000-library@^4.17.2
  ttlappalainen/NMEA2000_esp32 @ ^1.0.0
  adafruit/Adafruit ADS1X15@^2.3.0

[espressif32_base]
;this section has config items common to all ESP32 boards
platform = espressif32 @ ^6.9.0
build_unflags =
  -Werror=reorder
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder
lib_ignore = esp_websocket_client

[env:esp32dev]
extends = espressif32_base
board = esp32dev
; Pre-build patch: inject a "Dash" navbar item into the SensESP web UI
; (see scripts/patch_sensesp_navbar.py for why this can't be done from the sketch).
extra_scripts = pre:scripts/patch_sensesp_navbar.py
platform_packages =
  toolchain-xtensa-esp32 @ 11.2.0
build_flags =
  -D LED_BUILTIN=2
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
  -D TAG='"Arduino"'
  -D USE_ESP_IDF_LOG
  ; Comment out this line to disable NMEA 2000 output.
  -D ENABLE_NMEA2000_OUTPUT
  ; Comment out this line to disable Signal K support. At the moment, disabling
  ; Signal K support also disables all WiFi functionality.
  -D ENABLE_SIGNALK
  -std=gnu++17

;; Uncomment and change these if PlatformIO can't auto-detect the ports
;upload_port = /dev/tty.SLAB_USBtoUART
;monitor_port = /dev/tty.SLAB_USBtoUART

upload_protocol = espota
upload_port = perkins.local
upload_flags = ${secrets.ota_auth}

[env:dev_board32]
; Bench/test build for a bare ESP32 dev board (different hardware & network
; than the Perkins boat unit). Pin profile is selected via -D BOARD_DEV32
; in halmet_const.h. Build/upload with `pio run -e dev_board32 -t upload`.
extends = espressif32_base
board = esp32dev
extra_scripts = pre:scripts/patch_sensesp_navbar.py
platform_packages =
  toolchain-xtensa-esp32 @ 11.2.0
build_flags =
  -D LED_BUILTIN=2
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
  -D TAG='"Arduino"'
  -D USE_ESP_IDF_LOG
  -D ENABLE_NMEA2000_OUTPUT
  -D ENABLE_SIGNALK
  -D BOARD_DEV32
  -std=gnu++17

upload_protocol = espota
upload_port = perkins.local
upload_flags = ${secrets.ota_auth}

[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=c++14 -I src
